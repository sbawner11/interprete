<?xml version="1.0" encoding="UTF-8"?>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/defaultBack.xhtml">
 
	<ui:define name="content">
		<f:event type="preRenderView" listener="#{bandejaValidacionTramitesBean.cargaMsgErrorFirmante}" />
		<h:form id="frmTramites">
			<p:outputPanel id="pnlContenedor" style="padding: 2% 0 2%; max-width: 1121px; margin: auto;">
				<p:outputPanel id="pnlMisTramites" style="padding: 2% 2%; background: #FFF; border-radius: 10px">
					<p:panelGrid id="pnlTitulo" columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
						<p:column id="clmTitulo" style="text-align: center !important;">
							<p:outputLabel value="Bandeja de Solicitudes #{seccionesProyectoBean.proyectoDTO.nombreProyecto}" styleClass="font-titulo-bandeja" />
						</p:column>
					</p:panelGrid>
					
					<p:panelGrid id="pnlLblPeriodos" columns="1" columnClasses="ui-g-12 ui-md-6 ui-lg-3" layout="grid" styleClass="ui-panelgrid-blank ui-fluid mt-5">
						<p:outputLabel value="Mostrar folios del período:" styleClass="font-titulo-bandeja" style="font-size: 16px !important;"/>
					</p:panelGrid>
					
					<p:panelGrid id="pnlFiltros" columns="#{seccionesProyectoBean.authenticacionCiudadano == true ? '5' : '4'}" 
						columnClasses="#{seccionesProyectoBean.authenticacionCiudadano == true ? 'ui-g-12 ui-md-4 ui-lg-3, 
							ui-g-12 ui-md-4 ui-lg-3, 
							ui-g-12 ui-md-4 ui-lg-2, 
							ui-g-12 ui-md-4 ui-lg-2, 
							ui-g-12 ui-md-4 ui-lg-2' : 
							'ui-g-12 ui-md-4 ui-lg-3, 
							ui-g-12 ui-md-4 ui-lg-3, 
							ui-g-12 ui-md-4 ui-lg-3, 
							ui-g-12 ui-md-4 ui-lg-3'}"
						layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
						
						<p:column id="cmlFolio">
							<p:outputLabel value="#{msg.bandeja_ciudadano_folio}" styleClass="font-campos" />
							<p:inputText id="txtFolio" onkeyup="$(this).val(($(this).val().replace(/[^A-Za-z0-9\-]/g, '')).toUpperCase());"
								value="#{bandejaValidacionTramitesBean.tramiteBusqueda.folioSeguimiento}" maxlength="25"
								placeholder="#{msg.bandeja_ciudadano_folio_placeholder}" styleClass="inputText-motor"
								style="margin-top: 2px; font-size: 16px !important;">
								<p:keyFilter regEx="/[A-Za-z0-9\-]/i" preventPaste="false" />
							</p:inputText>
						</p:column>
						
						<!-- Columna que solo se habilita si el proyecto tiene habilitada la opción para que el ciudadano ingrese con llave-->													
						<p:column id="cmlCurp" rendered="#{seccionesProyectoBean.authenticacionCiudadano == true}">
							<p:outputLabel value="#{msg.bandeja_ciudadano_curp}" styleClass="font-campos" />
							<p:inputText id="txtCurp" onkeyup="$(this).val($(this).val().toUpperCase());"
								value="#{bandejaValidacionTramitesBean.tramiteBusqueda.usuario.curp}" maxlength="18"
								placeholder="#{msg.bandeja_ciudadano_curp_placeholder}" styleClass="inputText-motor"
								style="margin-top: 2px; font-size: 16px !important;" >
								<p:keyFilter regEx="/[A-Z0-9]/i" preventPaste="false" />
							</p:inputText>
						</p:column>
						
						<p:column id="cmlDesde">
							<p:outputLabel value="Desde" styleClass="font-campos" />
							<p:datePicker id="dpkDesde" autocomplete="off" maxdate="#{bandejaValidacionTramitesBean.fechaActual}"
								value="#{bandejaValidacionTramitesBean.tramiteBusqueda.fechaDesde}"
								pattern="dd/MM/yyyy" placeholder="DD/MM/AAAA"
								onkeypress="return false;" locale="es_MX"
								monthNavigator="true" yearNavigator="true">
								<p:ajax process="@this" update="@this" />
								<p:ajax event="dateSelect" listener="#{bandejaValidacionTramitesBean.listenerFechaInicial()}" update="dpkHasta messages"/>
							</p:datePicker>
						</p:column>
						
						<p:column id="cmlHasta">
							<p:outputLabel value="Hasta" styleClass="font-campos" />
							<p:datePicker id="dpkHasta" autocomplete="off" maxdate="#{bandejaValidacionTramitesBean.fechaMaxima}"
								mindate="#{bandejaValidacionTramitesBean.fechaMinima}"
								value="#{bandejaValidacionTramitesBean.tramiteBusqueda.fechaHasta}"
								pattern="dd/MM/yyyy" placeholder="DD/MM/AAAA"
								onkeypress="return false;" locale="es_MX"
								monthNavigator="true" yearNavigator="true">
								<p:ajax process="@this" update="@this" />
								<p:ajax event="dateSelect" listener="#{bandejaValidacionTramitesBean.listenerFechaFinal()}" update="dpkHasta messages"/>
							</p:datePicker>
						</p:column>
												
						<p:column id="clmEstatus" style="padding-top: 0px;" >
							<p:outputLabel value="#{msg.bandeja_ciudadano_estatus}" styleClass="font-filtros-bandeja" />
							<p:selectOneMenu id="selEstatus" value="#{bandejaValidacionTramitesBean.tramiteBusqueda.catEstatusTramiteDTO.idEstatusTramite}" 
								styleClass="tramites-selectOneMenu-admin"
								style="width: 100% !important">
								<f:selectItem itemLabel="#{msg.opc_todos}" />
								<f:selectItems value="#{bandejaValidacionTramitesBean.lstEstatusTramite}" var="estatus"
									itemValue="#{estatus.idEstatusTramite}" 
									itemLabel="#{seccionesProyectoBean.proyectoDTO.aviso ? estatus.descripcionAviso : estatus.descripcion}"/>
								<p:ajax event="itemSelect" process="@this selEstatus" />
							</p:selectOneMenu>
						</p:column>
						
					</p:panelGrid>
					
					<p:panelGrid columns="1" style="text-align: left;"
						columnClasses="ui-g-12 ui-md-12 ui-lg-12" 
						layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
						
						<p:column id="clmFiltrar" style="display:flex;justify-content: right;align-items: flex-end;margin: 1% auto 0;">
							<p:commandButton value="#{msg.bandeja_ciudadano_filtrar}" styleClass="formularios-btn-green" update="pnlFiltros, pnlTabla, messages" 
								style="max-width: 180px !important;"
								action="#{bandejaValidacionTramitesBean.filtrarTramites()}"/>
							<p:commandButton value="#{msg.limpiar}" styleClass="motor-btn-limpiar" 
								action="#{bandejaValidacionTramitesBean.limpiarFiltros()}" update="@form" style="width: auto;"/>
						</p:column>
						
					</p:panelGrid>
					
				   	<p:panelGrid id="pnlAsignarOperador" columns="#{authenticatorBean.rolSupervisor == true ? '3' : '1'}" columnClasses="#{authenticatorBean.rolSupervisor  ? 
				   		'ui-g-6 ui-md-8 ui-lg-4, ui-g-6 ui-md-8 ui-lg-6, ui-g-12 ui-md-12 ui-lg-2' : 'ui-g-12 ui-md-12 ui-lg-12'}" 
				   		layout="grid" styleClass="ui-panelgrid-blank ui-fluid" style="text-align: left;">
				   		<p:outputPanel rendered="#{authenticatorBean.rolSupervisor}">
				   			<p:outputLabel value="Operador" styleClass="font-titulo-bandeja" style="font-size: 16px !important;" />
				   			<p:selectOneMenu id="somUsuariosOperadoresActivos" value="#{bandejaValidacionTramitesBean.usuarioOperadorDTO.idUsuarioLlaveCdmx}"
				   				styleClass="tramites-selectOneMenu-admin"
				   				style="width: 100% !important" >
				   				<f:selectItem itemLabel="#{msg.seleccione}" itemValue="#{null}" />
				   				<f:selectItems value="#{bandejaValidacionTramitesBean.lstUsuariosOperadoresActivos}" 
				   					var="operador" itemLabel="#{operador.nombreCompleto}" itemValue="#{operador.idUsuarioLlaveCdmx}" />
				   				<p:ajax event="valueChange" 
				                	listener="#{bandejaValidacionTramitesBean.listenerUsuarioOperador()}" />
				   			</p:selectOneMenu>
				   		</p:outputPanel>
				   		
				   		<p:outputPanel rendered="#{authenticatorBean.rolSupervisor}" style="margin: 30px 0 0;">
				   			<p:panelGrid layout="grid" columns="2" columnClasses="ui-g-12 ui-md-6 ui-lg-4, ui-g-12 ui-md-6 ui-lg-8" 
								styleClass="ui-panelgrid-blank ui-fluid">
								
								<p:panelGrid layout="grid" columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12" 
									styleClass="ui-panelgrid-blank ui-fluid ui-panelgrid-sin-pading">
						   			<p:commandButton id="btnAsignarOperadores" value="Asignar Operador" 
						   				rendered="#{authenticatorBean.rolSupervisor}" action="#{bandejaValidacionTramitesBean.asignarOperadorTramites()}"
						   				update="somUsuariosOperadoresActivos frmTramites dtTramites pnlTabla" 
						   				styleClass="formularios-btn-green" style="width:165px; height: 36px !important;" />
				   				</p:panelGrid>
				   				
				   				<p:panelGrid layout="grid" columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12" 
									styleClass="ui-panelgrid-blank ui-fluid ui-panelgrid-sin-pading">
				   				
					   				<p:commandButton value="Firmar trámites" action="#{bandejaValidacionTramitesBean.iniciarModalFirmadoTramites()}"				   				
					   					rendered="#{bandejaValidacionTramitesBean.validaPermisosFirmado() == true}" update="mdlFirmaTramites, messages" 
					   					styleClass="formularios-btn-green" style="max-width:165px; height: 36px !important;" />
					   			</p:panelGrid>
				   			</p:panelGrid>
				   		</p:outputPanel>
				   		
				   		<p:panelGrid layout="grid" rendered="#{authenticatorBean.rolOperador}" columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12" styleClass="ui-panelgrid-blank ui-fluid ui-panelgrid-sin-pading">
				   				
					   		<p:commandButton action="#{bandejaValidacionTramitesBean.iniciarModalFirmadoTramites()}" 
					   			value="Firmar trámites" update="mdlFirmaTramites, messages" 
					   			rendered="#{bandejaValidacionTramitesBean.validaPermisosFirmado() == true}" styleClass="formularios-btn-green" 				   				
					   			style="margin: 0px !important; max-width:174px; height: 36px !important;" />
					   			
				   		</p:panelGrid>		
				   		
				   		<p:outputPanel style="margin: 40px 0 0; text-align: right !important;">
				   			<p:panelGrid layout="grid" columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12" styleClass="ui-panelgrid-blank ui-fluid">
						   		<p:panelGrid layout="grid" columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12" styleClass="ui-panelgrid-blank ui-fluid ui-panelgrid-sin-pading">
							   		<p:commandButton value="#{msg.lbl_dashboard_exportar}" action="#{bandejaValidacionTramitesBean.listenergenerarExcel(bandejaValidacionTramitesBean.lstTramites)}" styleClass="formularios-btn-green" update="messages" 
										style="margin: 0px !important; max-width:120px; height: 36px !important;" >
										<!-- <p:dataExporter type="xls" target="dtTramites" fileName="ReporteTramites"></p:dataExporter> -->
									</p:commandButton>								   			
							   	</p:panelGrid>				   		
				   			</p:panelGrid>
				   		</p:outputPanel>
				   						   						   						   		
				   	</p:panelGrid>
	
					<p:panelGrid id="pnlTabla" columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
						<p:dataTable id="dtTramites" 
							var="tramite" value="#{bandejaValidacionTramitesBean.lstTramites}"
							paginator="true" rows="10" reflow="true" paginatorPosition="bottom"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							currentPageReportTemplate="Mostrando {endRecord} de {totalRecords} resultados"
							emptyMessage="#{msg.bandeja_ciudadano_vacia}"
							widgetVar="dtbTramites"
							selection="#{bandejaValidacionTramitesBean.lstTramitesSeleccionados}" 
							rowKey="#{tramite.idTramite}">
							
							<p:column selectionMode="multiple" width="40" rendered="#{authenticatorBean.rolSupervisor}" style="padding-left: 10px!important;"/>
							
							<p:column id="clmFolio" exportable="true"
								sortBy="#{tramite.folioSeguimiento}"
								styleClass="header-columna-tramites" colspan="1" style="height: 65px;">
								<f:facet name="header"> Folio del<br/>trámite </f:facet>
								<h:outputText value="#{tramite.folioSeguimiento}" styleClass="tbody-tramites" />
							</p:column>
							
							<p:column id="clmFecEnv" headerText="Fecha de envío"
								sortBy="#{bandejaValidacionTramitesBean.buscarFechaEnvio(tramite.idTramite)}"
								rendered="#{!seccionesProyectoBean.proyectoDTO.aviso}"
								styleClass="header-columna-tramites" colspan="1" style="height: 65px;">
								<p:commandLink
							        value="#{bandejaValidacionTramitesBean.buscarFechaEnvio(tramite.idTramite)}"
							        rendered="#{!seccionesProyectoBean.proyectoDTO.aviso}"
							        actionListener="#{bandejaValidacionTramitesBean.cargarHistoricoEstatus(tramite.idTramite)}"
							        update="dlgHistoricoEstatus"
							        oncomplete="PF('dlgHistoricoEstatus').show()"
							        styleClass="tbody-tramites"/>
							</p:column>
							
							<!-- Columna que solo se habilita si el proyecto tiene habilitada la opción para que el ciudadano ingrese con llave-->
							<p:column id="clmCurp" rendered="#{seccionesProyectoBean.authenticacionCiudadano == true}"
								sortBy="#{tramite.usuario.curp}" 
								colspan="2" headerText="Curp" styleClass="header-columna-tramites">
								<h:outputText value="#{tramite.usuario.curp}" styleClass="tbody-tramites" />
							</p:column>
															
							<p:column id="clmFecSol" headerText="#{msg.bandeja_ciudadano_columna_fecha}"
								sortBy="#{tramite.fechaCreacion}"
								styleClass="header-columna-tramites" colspan="1">
								<h:outputText value="#{tramite.fechaCreacion}" styleClass="tbody-tramites" >
									<f:convertDateTime type="date" pattern="dd/MM/yyyy"/>
								</h:outputText>
							</p:column>
							
							<p:column headerText="Operador" rendered="#{authenticatorBean.rolSupervisor}"
								styleClass="header-columna-tramites" colspan="1">
								<h:outputText value="#{tramite.usuarioOperador.nombre} #{tramite.usuarioOperador.primerApellido} #{tramite.usuarioOperador.segundoApellido}" 
									styleClass="tbody-tramites" >
								</h:outputText>
							</p:column>
							
							<!-- Columna que solo se habilita si el proyecto tiene habilitada la opción para firmar archivos de respuesta de trámites y si el rol puede hacerlo-->
							<!-- rendered="#{seccionesProyectoBean.habilitarFirmadoTramites == true and bandejaValidacionTramitesBean.validaPermisosFirmado() == true}" -->
							<p:column id="clmAcciones" rendered="#{!seccionesProyectoBean.proyectoDTO.aviso and ((seccionesProyectoBean.lstRespuesta ne null) or 
								bandejaValidacionTramitesBean.mostrarColumnaAcciones())}" colspan="1" headerText="Acciones" styleClass="header-columna-tramites">
								
								<!-- La opción para realizar el firmado estará habilitada para trámites que aún no han sido firmados -->	
								<p:outputPanel rendered="#{tramite.tramiteFirmado == false}" 
									style="display: flex; align-items: center; justify-content: space-evenly;">
									<p:commandButton id="btnFirmar" action="#{registrarFormularioBean.iniciarFirmaTramiteBandeja()}"
										rendered="#{bandejaValidacionTramitesBean.validaPermisosFirmado() == true and 
										(tramite.catEstatusTramiteDTO.idEstatusTramite == 6 or tramite.catEstatusTramiteDTO.idEstatusTramite == 7)}"
										styleClass="acciones-firma" icon="icono-firmar-archivo">
										<f:setPropertyActionListener value="#{tramite}" target="#{registrarFormularioBean.tramiteActual}" />
									</p:commandButton>		
									
									<!-- BOTON PARA REVERTIR ESTATUS DE TRAMITES -->									
									<p:commandButton action="#{bandejaValidacionTramitesBean.mostrarModalRevertirEstatus(tramite)}" 
										styleClass="boton-gray-revertir-estatus" icon="icono-revertir-estatus"
										rendered="#{bandejaValidacionTramitesBean.mostrarOpcionRevertir() and (tramite.catEstatusTramiteDTO.idEstatusTramite == 4 
											or tramite.catEstatusTramiteDTO.idEstatusTramite == 6 or tramite.catEstatusTramiteDTO.idEstatusTramite == 7)}"
										style="max-width: 100px !important;" immediate="true" update="modalRevertirEstatus" />		
								</p:outputPanel>	
								
								<!-- La opción para descargar el documento estará habilitada para los trámites que fueron firmados -->	
								<p:outputPanel rendered="#{tramite.tramiteFirmado == true
									and bandejaValidacionTramitesBean.validaPermisosDescargaArchivo() == true}" 
									style="display: flex; align-items: center; justify-content: space-evenly;">

									<!-- BOTON PARA FIRMADO -->
									<p:commandButton action="#{bandejaValidacionTramitesBean.generarArchivo(tramite)}"
										styleClass="acciones-firma" icon="icono-decargar-archivo"
										rendered="#{(tramite.catEstatusTramiteDTO.idEstatusTramite == 6 or tramite.catEstatusTramiteDTO.idEstatusTramite == 7) and seccionesProyectoBean.lstRespuesta != null and seccionesProyectoBean.habilitarFirmadoTramites eq true}"
										style="max-width: 100px !important;" immediate="true" update="messages" ajax="false"
										disabled="#{tramite.tramiteFirmado eq false}"/>
									
									<!-- BOTON PARA CUANDO NO HAY FIRMA -->
									<p:commandButton action="#{bandejaValidacionTramitesBean.generarArchivo(tramite)}" styleClass="formularios-btn-green"
										value="Descargar"
										rendered="#{(tramite.catEstatusTramiteDTO.idEstatusTramite == 6 or tramite.catEstatusTramiteDTO.idEstatusTramite == 7) and seccionesProyectoBean.lstRespuesta != null and seccionesProyectoBean.habilitarFirmadoTramites eq false}"
										style="max-width: 100px !important;" immediate="true" update="messages" ajax="false"/>

									<!-- BOTON PARA REVERTIR ESTATUS DE TRAMITES -->
									<p:commandButton action="#{bandejaValidacionTramitesBean.mostrarModalRevertirEstatus(tramite)}" 
										styleClass="boton-gray-revertir-estatus" icon="icono-revertir-estatus"
										rendered="#{bandejaValidacionTramitesBean.mostrarOpcionRevertir() and (tramite.catEstatusTramiteDTO.idEstatusTramite == 4 
											or tramite.catEstatusTramiteDTO.idEstatusTramite == 6 or tramite.catEstatusTramiteDTO.idEstatusTramite == 7)}"
										style="max-width: 100px !important;" immediate="true" update="modalRevertirEstatus" />
								</p:outputPanel>							
									
							</p:column>
							
							<p:column id="clmEstatus" colspan="1" exportable="false" headerText="#{msg.bandeja_ciudadano_columna_estatus}"
								sortBy="#{tramite.catEstatusTramiteDTO.idEstatusTramite}" 
								styleClass="header-columna-tramites">
								<div class="#{tramite.estiloEstatus} header-movil estatus-completo"> 
									<p:commandLink value="#{seccionesProyectoBean.proyectoDTO.aviso ? tramite.catEstatusTramiteDTO.descripcionAviso : tramite.catEstatusTramiteDTO.descripcion}"
										action="#{registrarFormularioBean.iniciarEdicionFormulario(tramite, true)}"   
										styleClass="#{tramite.estiloTxtEstatus}"  
										style="text-decoration: none;" />
								</div> 
							</p:column>
							
							<p:column id="clmDescargaResolucion"
					          headerText="#{msg.bandeja_ciudadano_columna_descargar}"
					          styleClass="header-columna-tramites"> 
					          	<p:commandButton id="btnDescargaResolucion" icon="icono-decargar-resolucion"
					          		styleClass="acciones-firma" style="max-width: 100px !important;"
					          		rendered="#{(tramite.catEstatusTramiteDTO.idEstatusTramite == 9 and not empty tramite.rutaDocumentoResolucionPositiva)
					          			or (tramite.catEstatusTramiteDTO.idEstatusTramite == 10 and not empty tramite.rutaDocumentoResolucionNegativa)}"
					          		actionListener="#{bandejaValidacionTramitesBean.generarResolucion(tramite)}"
					          		ajax="false" process="@this" />
					          	<p:tooltip for="btnDescargaResolucion" value="Descargar resolución" position="top" />
					         </p:column>
							
							<p:column id="clmRevocacion" colspan="1" styleClass="header-columna-tramites"
								headerText="Revocar aviso" 
								rendered="#{seccionesProyectoBean.proyectoDTO.aviso 
									and seccionesProyectoBean.proyectoDTO.habilitaRevocacionAviso}" >
								<!-- BOTON PARA REVOCAR AVISOS -->									
								<p:outputPanel style="display: flex; align-items: center; justify-content: center;">
									<p:commandButton action="#{bandejaValidacionTramitesBean.mostrarModalRevocarAviso(tramite)}" 
										styleClass="boton-gray-revertir-estatus" icon="icono-revertir-estatus"
										rendered="#{tramite.catEstatusTramiteDTO.idEstatusTramite == 7 and bandejaValidacionTramitesBean.mostrarOpcionRevocarAviso()}"
										style="max-width: 100px !important;" immediate="true" update="modalRevocarAviso" />	
								</p:outputPanel>
								<!-- BOTON PARA VISUALIZAR EL MOTIVO DE RECHAZO Y EL DOCUMENTO DE RECHAZO -->
								<p:outputPanel
									style="display: flex; align-items: center; justify-content: center;">
									<p:commandButton id="btnverMotivoRevocacion" action="#{bandejaValidacionTramitesBean.mostrarModalVerRevocacion(tramite)}" 
										styleClass="boton-gray-revertir-estatus" icon="icono-info-red"
										style="max-width: 100px !important;background: none !important;" immediate="true" update="modalVerRevocacion" 
										rendered="#{tramite.catEstatusTramiteDTO.idEstatusTramite == 6 and seccionesProyectoBean.proyectoDTO.aviso}"/>
									<p:tooltip for="btnverMotivoRevocacion" value="Ver motivo revocación"  position="top"/>
								</p:outputPanel>
							</p:column>
							
							<!-- la columna Estatus Pago solo esta disponible para proyectos habilitado para pago en linea-->
							<p:column id="clmEstatusLC" headerText="#{msg.bandeja_ciudadano_columna_estatus_pago}" 
								rendered="#{seccionesProyectoBean.proyectoDTO.proyectoLineaCaptura}"
								styleClass="header-columna-tramites" colspan="1">
								<div class="#{tramite.estiloLCEstatus} header-movil estatus-completo" > 
									<p:commandLink value="#{tramite.lineaCapturaDTO.catEstatusLineaCaptura.descripcion}"
										action="#{bandejaValidacionTramitesBean.mostrarModalEstatusLC(tramite)}"
