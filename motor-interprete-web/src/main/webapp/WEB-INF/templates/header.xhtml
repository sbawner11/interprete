<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:p="http://primefaces.org/ui">
                
	<style>
		.menu_desplegable {
			font-weight: 400 !important;
			color: #611232 !important;
			padding: 3px 20px !important;
			line-height: 1.428571429 !important;
			white-space: nowrap !important;
			font-size: 17px !important;
		}
	</style>
	
	<p:panel id="menuUsuario" styleClass="ui-height-nav-menu-template" rendered="#{authenticatorBean.usuarioLogueado != null}">
		<nav class="navbar navbar-expand-md navbar-dark bg-light sub-navbar fixed-top">
			<div class="container">
				<button type="button" class="navbar-toggler"
					data-bs-toggle="collapse" data-bs-target="#subNavBarDropdown"
					aria-controls="subNavBarDropdown" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>

				<a class="navbar-brand sub-navbar" href="#">ATDT</a>

				<div class="collapse navbar-collapse" id="subNavBarDropdown">
					<ul class="navbar-nav">
						<li class="nav-item dropdown">
							<a class="nav-link subnav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false"> 
							#{authenticatorBean.usuarioLogueado.nombre}</a>
							<ul class="dropdown-menu" aria-labelledby="navbarDropdown">								
								<li>
				              		<p:commandLink  value="Cambiar persona moral o fisica" immediate="true"
										styleClass="menu_desplegable" rendered="#{authenticatorBean.habilitarMenuPersonaMoral}" action="#{authenticatorBean.inicializarPersonasMorales()}"/>
								</li>				              	
				                <li>
				                	<p:commandLink action="#{bandejaValidacionTramitesBean.inicializar()}" value="Bandeja de trámites" immediate="true"
										styleClass="menu_desplegable" rendered="#{authenticatorBean.rolConsulta == true or authenticatorBean.rolSupervisor == true or authenticatorBean.rolOperador == true or authenticatorBean.rolAdministrador == true or authenticatorBean.rolAdministradorDatosTecnicos == true}"/>
								</li>
								<li>
									<p:commandLink action="#{bandejaTramitesBean.inicializar()}" value="Mis trámites" immediate="true"
										styleClass="menu_desplegable"/>
								</li>	
								<li>
									<p:commandLink action="#{reporteContadoresProyectosBean.inicializar()}" value="Dashboard" immediate="true"
										styleClass="menu_desplegable"  rendered="#{authenticatorBean.rolAdministrador == true or authenticatorBean.rolAdministradorDatosTecnicos == true}"/>
								</li>	
								<li>
									<p:commandLink action="#{asignarPermisosBDBean.inicializar()}" value="Asignar permisos en DB" immediate="true"
										styleClass="menu_desplegable"  rendered="#{authenticatorBean.rolAdministrador == true or authenticatorBean.rolAdministradorDatosTecnicos == true}"/>
								</li>
								<li>
									<p:commandLink action="#{asignarSolicitudesBean.inicializar()}" value="Distribución de solicitudes" immediate="true"
										styleClass="menu_desplegable"  rendered="#{(authenticatorBean.rolAdministrador or authenticatorBean.rolAdministradorDatosTecnicos) and seccionesProyectoBean.habilitaDistribucion == true}"/>
								</li>
								<li>
									<p:commandLink action="#{reinicioClienteMotorBean.inicializar()}" value="Reiniciar Cliente" immediate="true"
										styleClass="menu_desplegable"  rendered="#{reinicioClienteMotorBean.permiteReiniciarCliente()}"/>
								</li>
								<li>
									<p:commandLink action="#{solicitarSincronizacionBean.inicializar()}"  value="Sincronizar proyecto" immediate="true"
										styleClass="menu_desplegable" rendered="#{authenticatorBean.rolAdministradorDatosTecnicos == true}"/>
								</li>						
								<p:divider />						
								<li>
									<p:commandLink action="#{authenticatorBean.cerrarSesionUsuario()}" value="#{msg.cerrar_sesion}" immediate="true"
										styleClass="menu_desplegable" rendered="#{!authenticatorBean.ingresaBackOffice}"/>
								</li>
								<li>
									<p:commandLink action="#{authenticatorBean.cerrarSesionUsuarioFuncionario()}" value="#{msg.cerrar_sesion}" immediate="true" 
										styleClass="menu_desplegable" rendered="#{authenticatorBean.ingresaBackOffice}"/>
								</li>	
							</ul>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</p:panel>

</ui:composition>
