<ui:composition xmlns="http://www.w3.org/1999/xhtml"
   xmlns:ui="http://java.sun.com/jsf/facelets"
   xmlns:f="http://java.sun.com/jsf/core"
   xmlns:h="http://java.sun.com/jsf/html"
   xmlns:p="http://primefaces.org/ui"
   template="/WEB-INF/templates/default2.xhtml">
   
   <ui:define name="content">
   	<p:outputPanel id="Contenedor"
			style="padding: 2% 0 2%; max-width: 1121px; margin: auto;">
   		<p:outputPanel style="background: white;border-radius: 18px 18px 18px 18px;">
   			<p:panelGrid columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12"
				layout="grid"
				styleClass="ui-panelgrid-blank ui-fluid ui-panel-sin-pading caja-divisora-cafe"
				style="margin-top: -5px;" />
		   	<h:form id="frmMensaje"  >
		   	
		   		<p:panelGrid id="pnlParrafo1" columns="1" columnClasses="ui-grid-col-12" layout="grid" styleClass="parrafo1 ui-panelgrid-blank ui-fluid" >
	      			<p style="font-size:25px !important; color: #0f4c42 !important; font-weight: bold !important;">#{msg.sin_asignacion_distribucion} </p>
	      			<p class="titulo-home-tramite">#{indexBean.proyectoDTO.nombreProyecto}</p>
				</p:panelGrid>
	
	           	<p:panelGrid id="pnlParrafo2" columns="1" columnClasses="ui-grid-col-12" layout="grid" styleClass="parrafo1 ui-panelgrid-blank ui-fluid" >
	      			<p style="font-size:22px !important; color: #0f4c42 !important; font-weight: bold !important;">#{msg.mensaje_acceso_distribucion}</p>
				</p:panelGrid>
				
				<div id="iniciar" align="center" style="margin: 20px auto;">
					<p:commandButton id="btnAcptar" value="#{msg.aceptar}" action="#{authenticatorBean.cerrarSesionUsuarioFuncionario()}"
						styleClass="formularios-btn-prevencion" 
						style="width: 160px; height:27px;" immediate="true"/>
				</div>			
				
			</h:form>
			<p:panelGrid columns="1" columnClasses="ui-g-12 ui-md-12 ui-lg-12"
				layout="grid"
				styleClass="ui-panelgrid-blank ui-fluid ui-panel-sin-pading caja-divisora-cafe"
				style="margin-top: -5px;" />
		</p:outputPanel>
	</p:outputPanel>
   </ui:define>
</ui:composition>
